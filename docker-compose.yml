services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: fluxspan-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TIMESCALEDB_TELEMETRY: "off"
      NO_TS_TUNE: "true"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  go-worker:
    build:
      context: ./fluxspan-worker
      dockerfile: Dockerfile.dev
    container_name: fluxspan-go-worker
    volumes:
      - ./fluxspan-worker:/app
    environment:
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GOTOOLCHAIN=auto
      - DB_HOST=fluxspan-db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
