[project]
name = "fluxspan-api"
version = "0.1.0"
description = "FastAPI Backend for FluxSpan"
authors = [
    { name = "Thomas Truong", email = "TruongThomasQ@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
]

[tool.pylint.main]
pythonpath = ["."]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
